name: Subway Surfers - compile-check decompiled C# (no APK build)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild analysis package
        shell: bash
        run: |
          set -euo pipefail
          test -f Subway_Surfers_1.0.0_Stage3_Compile_Check.zip
          unzip -t Subway_Surfers_1.0.0_Stage3_Compile_Check.zip
          unzip -q Subway_Surfers_1.0.0_Stage3_Compile_Check.zip -d work

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build decompiled assembly for diagnostic only
        shell: bash
        run: |
          set +e
          dotnet build work/Decompiled/Assembly-CSharp/Assembly-CSharp.csproj \
            --configuration Release > compile.log 2>&1
          code=$?
          set -e
          mkdir -p result
          cp compile.log result/
          echo "$code" > result/exit_code.txt
          {
            echo "Subway Surfers 1.0.0 decompiled C# compile check"
            echo "Exit code: $code"
            echo "This only checks decompiled C# against the extracted managed references."
            echo "It is NOT a Unity Android build and does NOT create an APK."
            echo
            grep -E 'error |warning |Build (FAILED|succeeded)' compile.log | tail -n 120 || true
          } > result/summary.txt
          # Do not fail the job: upload diagnostics even if compile has errors.
          exit 0

      - name: Upload diagnostic results
        uses: actions/upload-artifact@v4
        with:
          name: subway-surfers-stage3-compile-diagnostics
          path: result/
          if-no-files-found: error
          retention-days: 7
